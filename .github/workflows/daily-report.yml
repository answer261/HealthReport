name: Daily health report

on:
  schedule:
    # 9:00 w Warszawie: 07:00 UTC latem, 08:00 UTC zimą
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run only the cron matching 9:00 in Warsaw
        id: gate
        run: |
          offset=$(TZ=Europe/Warsaw date +%z)
          if [ "$EVENT" != "schedule" ] \
            || { [ "$CRON" = "0 7 * * *" ] && [ "$offset" = "+0200" ]; } \
            || { [ "$CRON" = "0 8 * * *" ] && [ "$offset" = "+0100" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.run == 'true'
        run: python daily_health_report.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
